[project]
name = "hermes-local-gateway"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.162.2",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "pyyaml==6.0.3",
  "jsonschema==4.26.0",
]

[dependency-groups]
dev = ["ruff==0.17.4", "pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
